[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-document-auditor"
version = "0.2.0"
description = "Privacy-first structural and citation auditing for research manuscripts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NovaPoint Consulting" }]
keywords = ["research", "citations", "thesis", "manuscript", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
research-audit = "research_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
